<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sy-Best - المنصة المميزة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #141414; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* 📱 شريط التنقل الاحترافي */
        .navbar { 
            background-color: #000000; 
            border-bottom: 3px solid #e50914; 
            padding: 12px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            flex-wrap: wrap;
            gap: 15px;
        }
        .navbar-brand { color: #e50914; font-weight: bold; font-size: 26px; text-decoration: none; }
        
        /* زر الـ Feedback */
        .btn-feedback {
            color: #ccc;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            background: #1a1a1a;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #333;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-left: auto;
            margin-right: 20px;
            cursor: pointer;
        }
        
        .btn-feedback:hover {
            color: #fff;
            background: #e50914;
            border-color: #e50914;
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.6);
            transform: translateY(-2px);
        }
        
        .btn-feedback:hover i { animation: wobble 0.5s ease-in-out infinite alternate; }
        @keyframes wobble { 0% { transform: rotate(0deg); } 100% { transform: rotate(15deg); } }

        .search-container { position: relative; display: flex; align-items: center; }
        .search-input { padding: 10px 15px; border: 1px solid #333; background-color: #111; color: #fff; border-radius: 4px; outline: none; width: 250px; font-size: 14px; text-align: right; }
        .live-search-results { position: absolute; top: 100%; right: 0; width: 330px; background-color: #0c0c0c; border: 1px solid #222; border-radius: 4px; max-height: 350px; overflow-y: auto; display: none; z-index: 200; margin-top: 5px; text-align: right; }
        .search-item { display: flex; gap: 12px; padding: 10px; border-bottom: 1px solid #1a1a1a; text-decoration: none; color: #fff; font-size: 13px; align-items: center; }
        .search-item img { width: 40px; height: 55px; object-fit: cover; border-radius: 4px; }
        
        .user-menu { display: flex; align-items: center; gap: 15px; margin-right: 20px; flex-wrap: wrap; }
        .btn-vip { background-color: #ffc107; color: #000; padding: 8px 16px; border-radius: 4px; font-weight: bold; text-decoration: none; font-size: 13px; transition: 0.2s; white-space: nowrap; }
        .btn-logout, .btn-login { color: #fff; text-decoration: none; font-size: 14px; background: #222; padding: 8px 14px; border-radius: 4px; transition: 0.2s; white-space: nowrap; }
        .btn-logout:hover, .btn-login:hover { background: #333; }
        
        /* 🔥 تعديل شريط الأقسام الكبرى ليدعم التمرير الأفقي اللمسّي المريح على الجوال */
        .category-bar { 
            background-color: #0a0a0a; 
            padding: 12px 20px; 
            display: flex; 
            gap: 10px; 
            justify-content: flex-start; 
            overflow-x: auto; 
            border-bottom: 1px solid #222; 
            -webkit-overflow-scrolling: touch;
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-btn { background: #1f1f1f; color: #ccc; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .cat-btn.active { background: #e50914; color: #fff; border-color: #e50914; }

        /* شريط فئات الأفلام الأصلي */
        .genres-bar { background-color: #080808; padding: 10px 20px; display: flex; gap: 12px; overflow-x: auto; border-bottom: 1px solid #1a1a1a; -webkit-overflow-scrolling: touch; }
        .genres-bar::-webkit-scrollbar { display: none; }
        .genre-btn { background: #151515; color: #aaa; border: 1px solid #252525; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; white-space: nowrap; transition: 0.2s; }
        .genre-btn.active { background: #fff; color: #000; border-color: #fff; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; box-sizing: border-box; }
        .flash-messages { background: #28a745; color: #fff; padding: 12px; border-radius: 4px; margin-bottom: 20px; font-weight: bold; text-align: center; font-size: 15px; }
        
        h2 { border-right: 4px solid #e50914; padding-right: 10px; margin: 30px 0 20px 0; font-size: 22px; color: #fff; }
        
        /* شبكة الأفلام */
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        @media(min-width: 480px) { .movies-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; } }
        
        .movie-card { background-color: #1f1f1f; border-radius: 8px; overflow: hidden; position: relative; transition: transform 0.4s ease, box-shadow 0.4s ease; display: flex; flex-direction: column; }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3); }
        
        .poster-container { width: 100%; height: 195px; background-color: #2a2a2a; position: relative; overflow: hidden; }
        @media(min-width: 480px) { .poster-container { height: 250px; } }
        
        .movie-poster { width: 100%; height: 100%; object-fit: cover; }
        .play-hover-btn { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; z-index: 2; }
        .play-hover-btn span { background: #e50914; color: #fff; padding: 8px 14px; border-radius: 50px; font-weight: bold; font-size: 12px; }
        .movie-card:hover .play-hover-btn { opacity: 1; }

        .movie-info { padding: 10px; text-align: center; }
        .movie-title { font-size: 13px; font-weight: bold; color: #fff; text-decoration: none; display: block; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .rating-badge { background-color: #ffc107; color: #000; font-weight: bold; position: absolute; top: 8px; left: 8px; padding: 3px 6px; border-radius: 4px; font-size: 10px; z-index: 3; }
        
        /* الـ Hero Slider السينمائي المطور للجوال */
        .hero-banner-wrapper { width: 100%; max-width: 1200px; margin: 15px auto 0 auto; padding: 0 15px; box-sizing: border-box; display: none; }
        .hero-slider { width: 100%; height: 250px; background-color: #000; border-radius: 12px; overflow: hidden; position: relative; }
        @media(min-width: 768px) { .hero-slider { height: 420px; } }
        
        .hero-slide { width: 100%; height: 100%; background-size: cover; background-position: center top; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: center; text-align: right; }
        .hero-slide.active { opacity: 1; z-index: 1; }
        
        /* غطاء تدرج ذكي لإظهار النصوص بوضوح مذهل */
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(20,20,20,1) 30%, rgba(20,20,20,0.5) 70%, rgba(0,0,0,0) 100%); z-index: 2; }
        @media(min-width: 768px) { .hero-overlay { background: linear-gradient(to right, rgba(20,20,20,0.95) 40%, rgba(20,20,20,0.4) 100%); } }
        
        .hero-content { position: relative; z-index: 3; max-width: 550px; padding: 0 20px; margin-top: auto; margin-bottom: 20px; }
        @media(min-width: 768px) { .hero-content { padding: 0 50px; margin-top: 0; margin-bottom: 0; } }
        
        .hero-badge { background: #e50914; color: #fff; font-size: 10px; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        .hero-title { font-size: 20px; font-weight: bold; margin: 0 0 8px 0; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        @media(min-width: 768px) { .hero-title { font-size: 36px; margin-bottom: 15px; } }
        
        .hero-overview { font-size: 12px; color: #ccc; line-height: 1.4; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @media(min-width: 768px) { .hero-overview { font-size: 15px; -webkit-line-clamp: 3; margin-bottom: 25px; } }
        
        .btn-hero-play { background: #fff; color: #000; font-weight: bold; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; }
        @media(min-width: 768px) { .btn-hero-play { padding: 12px 28px; font-size: 15px; gap: 8px; } }
        .btn-hero-play:hover { background: #e50914; color: #fff; }

        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 30px 0; }
        .page-btn { background: #e50914; color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .page-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        /* 📱 تعديلات الجوال المتقدمة والمدمجة */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: center;
                gap: 10px;
            }
            .navbar-brand {
                grid-column: 1;
                font-size: 22px;
            }
            .user-menu {
                grid-column: 2;
                margin-right: 0;
                justify-content: flex-end;
                gap: 8px;
            }
            .user-menu span { display: none; } /* إخفاء جملة "أهلاً بك" الطويلة لتوفير المساحة */
            .btn-login, .btn-logout, .btn-vip {
                font-size: 12px;
                padding: 6px 10px;
            }
            .search-container {
                grid-column: 1 / -1; /* يمتد على كامل العرض بسطر منفصل لسهولة البحث */
                width: 100%;
            }
            .search-input {
                width: 100%;
                box-sizing: border-box;
            }
            .live-search-results {
                width: 100%;
            }
            .btn-feedback {
                grid-column: 1 / -1;
                margin: 0;
                justify-content: center;
                font-size: 12px;
                padding: 6px 12px;
            }
            .category-bar {
                justify-content: flex-start; /* تفعيل خاصية السحب الفوري */
            }
        }
    </style>
</head>
