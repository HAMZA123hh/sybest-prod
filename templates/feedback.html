<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرسل رأيك - Sy-Best</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            background: linear-gradient(rgba(20, 20, 20, 0.75), rgba(10, 10, 10, 0.9)), 
                        url('https://assets.nflxext.com/ffe/siteui/vlv3/ab180a27-b661-44d7-a6d9-940cb32f2f4a/7fb62e44-31fd-4e1f-b6ad-564d6e412d29/SY-en-20231009-popsignuptwoweeks-perspective_alpha_website_large.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* شعار المنصة في الأعلى */
        .brand-logo {
            color: #e50914;
            font-weight: bold;
            font-size: 36px;
            text-decoration: none;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
        }
        .brand-logo:hover { transform: scale(1.05); }

        /* صندوق الملاحظات الرئيسي المطوّر */
        .box { 
            background: rgba(0, 0, 0, 0.85); 
            width: 100%;
            max-width: 520px; 
            margin: 0 auto; 
            padding: 40px 35px; 
            border-radius: 8px; 
            border: 1px solid #e50914; 
            box-shadow: 0 15px 35px rgba(229, 9, 20, 0.15);
            text-align: right;
        }
        
        .box h2 {
            color: #e50914; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .box p {
            color: #ccc; 
            font-size: 14px; 
            line-height: 1.6;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            font-size: 15px;
            color: #eee;
            display: block;
            margin-bottom: 8px;
            padding-right: 2px;
        }

        /* تحسين صندوق الكتابة وإضافة تأثير التوهج المودرن */
        textarea { 
            width: 100%; 
            height: 160px; 
            padding: 14px; 
            margin-bottom: 25px; 
            background: #333; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 6px; 
            font-family: inherit; 
            font-size: 15px; 
            resize: none; 
            outline: none;
            text-align: right;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        
        textarea:focus { 
            background: #444;
            border-color: #e50914;
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.4);
        }

        /* زر الإرسال التفاعلي */
        button { 
            background: #e50914; 
            color: #fff; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            font-weight: bold; 
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 16px; 
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }
        
        button:hover { 
            background: #c40812; 
            box-shadow: 0 6px 18px rgba(229, 9, 20, 0.5);
        }
        button:active { transform: scale(0.98); }

        /* رابط العودة للرئيسية */
        .back-link { 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            width: 100%;
            margin-top: 25px; 
            color: #aaa; 
            text-decoration: none; 
            font-size: 14px; 
            transition: color 0.2s;
        }
        .back-link:hover { 
            color: #fff; 
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <a href="/" class="brand-logo">Sy-Best</a>

    <div class="box">
        <h2><i class="fa-regular fa-comment-dots"></i> Sy-Best Feedback Hub</h2>
        <p>لديك رأي، طلب إضافة فيلم أو مسلسل، أم عثرت على رابط تعطل؟ أرسل لنا رسالة مباشرة وسيقوم فريق الإدارة بالتعامل معها فوراً.</p>
        
        <form method="POST">
            <label>اكتب رسالتك أو تفاصيل المشكلة هنا:</label>
            <textarea name="content" placeholder="مثال: يرجى إضافة مسلسل البروفيسور الموسم الجديد..." required></textarea>
            <button type="submit">إرسال الرسالة</button>
        </form>
        
        <a href="/" class="back-link">إلغاء والعودة للرئيسية <i class="fa-solid fa-arrow-left"></i></a>
    </div>

</body>
</html>
