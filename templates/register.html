<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Sy-Best</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            background: linear-gradient(rgba(20, 20, 20, 0.7), rgba(10, 10, 10, 0.9)), 
                        url('https://assets.nflxext.com/ffe/siteui/vlv3/ab180a27-b661-44d7-a6d9-940cb32f2f4a/7fb62e44-31fd-4e1f-b6ad-564d6e412d29/SY-en-20231009-popsignuptwoweeks-perspective_alpha_website_large.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* شعار المنصة في الأعلى يعود للرئيسية */
        .brand-logo {
            color: #e50914;
            font-weight: bold;
            font-size: 36px;
            text-decoration: none;
            margin-bottom: 20px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
        }
        .brand-logo:hover { transform: scale(1.05); }

        /* صندوق إنشاء الحساب الرئيسي */
        .box { 
            background: rgba(0, 0, 0, 0.85); 
            width: 100%;
            max-width: 400px; 
            margin: 0 auto; 
            padding: 40px 35px; 
            border-radius: 8px; 
            border: 1px solid #222; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            text-align: center;
        }

        .box h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: bold;
            text-align: right;
            padding-right: 5px;
        }
        
        .form-group {
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        /* تحسين حقول الإدخال وإضافة تأثير التوهج */
        input { 
            width: 100%; 
            padding: 13px 15px; 
            background: #333; 
            border: 1px solid #333; 
            color: #fff; 
            border-radius: 5px; 
            outline: none;
            font-size: 15px;
            text-align: right;
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        
        input:focus { 
            background: #444;
            border-color: #e50914;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.4);
        }

        /* حاوية كلمة المرور لاحتواء أيقونة العين على اليسار */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        
        .password-wrapper input {
            padding-left: 45px; /* مساحة للأيقونة */
        }

        .password-wrapper .toggle-password {
            position: absolute;
            top: 50%;
            left: 15px; 
            transform: translateY(-50%);
            color: #aaa;
            cursor: pointer;
            font-size: 16px;
            transition: color 0.2s;
            z-index: 10;
        }
        .password-wrapper .toggle-password:hover { color: #fff; }

        /* زر التسجيل الرئيسي */
        button { 
            background: #e50914; 
            color: #fff; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            font-weight: bold; 
            font-size: 16px;
            border-radius: 5px; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            margin-top: 10px;
        }
        
        button:hover { 
            background: #c40812; 
            box-shadow: 0 6px 18px rgba(229, 9, 20, 0.5);
        }
        button:active { transform: scale(0.98); }

        .login-text {
            font-size: 14px; 
            color: #737373;
            margin-top: 25px;
            margin-bottom: 0;
            text-align: right;
            padding-right: 5px;
        }
        .login-text a {
            color: #fff;
            text-decoration: none;
            margin-right: 5px;
        }
        .login-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <a href="/" class="brand-logo">Sy-Best</a>

    <div class="box">
        <h2>إنشاء حساب</h2>
        
        <form method="POST">
            <div class="form-group">
                <input type="text" name="username" placeholder="اسم المستخدم" required autocomplete="username">
            </div>

            <div class="form-group">
                <input type="email" name="email" placeholder="البريد الإلكتروني" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="كلمة المرور" required>
                    <i class="fa-solid fa-eye toggle-password" id="eyeIcon" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>
            
            <button type="submit">تسجيل حساب جديد</button>
        </form>
        
        <p class="login-text">لديك حساب بالفعل؟ <a href="/login">تسجيل الدخول</a></p>
    </div>

    <script>
        // دالة الـ JavaScript الخاصة بزر إظهار وإخفاء كلمة المرور
        function togglePasswordVisibility() {
            var passwordField = document.getElementById("password");
            var eyeIcon = document.getElementById("eyeIcon");
            
            if (passwordField.type === "password") {
                passwordField.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                passwordField.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
